<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD | Edition Spéciale 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. VARIABLES ET RESET
           ========================================= */
        :root {
            --rbx-orange: #ff3131;
            --rbx-blue: #00a2ff;
            --rbx-green: #02b757;
            --rbx-dark-green: #01853e;
            --rbx-bg: #e3e3e3;
            --rbx-sidebar: #f0f0f0;
            --rbx-shadow: 0 4px 0 rgba(0,0,0,0.2);
            --header-height: 120px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--rbx-bg) url('https://www.transparenttextures.com/patterns/cubes.png');
            font-family: 'Verdana', 'Geneva', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================================
           2. HEADER (BANNIÈRE ROBLOX 2010)
           ========================================= */
        #main-header {
            width: 100%;
            height: var(--header-height);
            background: linear-gradient(to bottom, #75aadb 0%, #ffffff 100%), 
                        url('https://www.transparenttextures.com/patterns/city.png');
            border-bottom: 4px solid var(--rbx-blue);
            display: flex;
            position: relative;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .logo-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .logo-container:hover { transform: scale(1.05); }

        .logo-main {
            font-family: 'Bungee', cursive;
            font-size: 50px;
            color: var(--rbx-orange);
            text-shadow: 4px 4px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            margin: 0;
            letter-spacing: -1px;
        }

        .logo-sub {
            background: yellow;
            color: black;
            font-weight: bold;
            padding: 2px 15px;
            border: 2px solid black;
            font-size: 16px;
            transform: rotate(-3deg) translateY(-10px);
            display: inline-block;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        /* Bouton Serveur Discord (Style Play Now) */
        .btn-discord {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(to bottom, #3dbd3d 0%, #1d8f1d 100%);
            border: 3px solid #fff;
            border-radius: 8px;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 5px 0 var(--rbx-dark-green), 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .btn-discord:active {
            transform: translateY(-48%);
            box-shadow: 0 2px 0 var(--rbx-dark-green);
        }
        .btn-discord span { font-size: 10px; display: block; opacity: 0.8; }

        /* =========================================
           3. LAYOUT PRINCIPAL
           ========================================= */
        .main-wrapper {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
            background: white;
            border: 3px solid #555;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* =========================================
           4. SIDEBAR (AMIS & PROFIL)
           ========================================= */
        .sidebar {
            width: 280px;
            background: var(--rbx-sidebar);
            border-right: 3px solid #ccc;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border: 2px solid #bbb;
            border-bottom: 5px solid #999;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .avatar-box {
            width: 80px;
            height: 80px;
            background: #f0f000;
            border: 3px solid #000;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .user-name {
            font-weight: bold;
            color: var(--rbx-blue);
            font-size: 18px;
            margin-bottom: 5px;
        }

        .user-statut {
            font-size: 11px;
            color: #777;
            background: #eee;
            padding: 4px;
            border-radius: 4px;
            font-style: italic;
        }

        .friends-section {
            flex: 1;
            overflow-y: auto;
        }

        .section-label {
            font-size: 12px;
            font-weight: bold;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        .friend-row {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .friend-row:hover { background: #fafafa; }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            border: 1px solid rgba(0,0,0,0.2);
        }
        .online { background: var(--rbx-green); }
        .offline { background: #bbb; }

        /* =========================================
           5. ZONE DE CHAT
           ========================================= */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }

        #chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Bulles de messages */
        .message-bubble {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            animation: slideIn 0.2s ease-out;
            border: 1px solid #eee;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid var(--rbx-blue);
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .msg-author { font-weight: bold; color: var(--rbx-blue); }
        .msg-time { font-size: 10px; color: #aaa; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Barre d'input en bas */
        .input-area {
            padding: 25px;
            background: #f4f4f4;
            border-top: 2px solid #ddd;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #msg-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ccc;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        #msg-input:focus { border-color: var(--rbx-blue); }

        #btn-send {
            background: var(--rbx-green);
            color: white;
            border: none;
            border-bottom: 5px solid var(--rbx-dark-green);
            padding: 14px 35px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.1s;
        }
        #btn-send:hover { background: #03cf63; }
        #btn-send:active { 
            transform: translateY(3px); 
            border-bottom-width: 2px;
        }

        /* Scrollbar Style */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; }

    </style>
</head>

    <script>
        /* =========================================
           LOGIQUE SUPABASE & CHAT
           ========================================= 
        */

        // CONFIGURATION
        const SUPABASE_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ETAT DE L'APPLICATION
        let currentUser = {
            name: "",
            avatar: "👤",
            joinedAt: new Date().toLocaleTimeString()
        };

        // INITIALISATION
        async function startApp() {
            console.log("Démarrage de LANOU-CORD...");
            
            // 1. Demander le pseudo
            currentUser.name = prompt("Bienvenue ! Entre ton pseudo Roblox :") || "Guest" + Math.floor(Math.random()*999);
            
            // 2. Mettre à jour l'interface profil
            document.getElementById('p-name').innerText = currentUser.name;
            
            // 3. Charger l'historique
            await fetchMessages();

            // 4. Activer le Realtime
            subscribeToChat();
        }

        // CHARGER LES MESSAGES DEPUIS LA TABLE 'messages'
        async function fetchMessages() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                console.error("Erreur historique:", error.message);
                return;
            }

            const container = document.getElementById('chat-messages');
            container.innerHTML = ""; // Clear loader
            data.forEach(msg => renderMessage(msg));
        }

        // ÉCOUTER LES NOUVEAUX MESSAGES
        function subscribeToChat() {
            supabase
                .channel('public_room')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'messages' 
                }, payload => {
                    renderMessage(payload.new);
                    playNotification();
                })
                .subscribe();
        }

        // AFFICHER UN MESSAGE DANS LE DOM
        function renderMessage(msg) {
            const container = document.getElementById('chat-messages');
            
            const div = document.createElement('div');
