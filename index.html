<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD 2010</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* STYLE ROBLOX CLASSIQUE */
        body { 
            margin: 0; padding: 0; 
            font-family: 'Tahoma', sans-serif; 
            background: radial-gradient(circle, #4A76A8 0%, #2a4d77 100%); 
            height: 100vh; display: flex; flex-direction: column; align-items: center; 
        }

        /* BARRE DE MENU HAUT */
        header { 
            background: linear-gradient(to bottom, #eeeeee, #cccccc); 
            width: 100%; height: 35px; border-bottom: 2px solid #555;
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box;
        }
        .rbx-logo { font-weight: bold; font-style: italic; color: #CC0000; text-shadow: 1px 1px white; }

        /* CONTENEUR CENTRAL (FENÊTRE DE JEU) */
        .app-window {
            margin-top: 50px;
            width: 700px; height: 500px;
            background: #D4D0C8; /* Gris Windows/Roblox 2010 */
            border: 3px solid #848484;
            border-right-color: #404040; border-bottom-color: #404040;
            display: flex; flex-direction: column;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        .title-bar { 
            background: #000080; color: white; padding: 4px 8px; font-weight: bold; font-size: 13px;
            display: flex; justify-content: space-between;
        }

        .main-content { display: flex; flex: 1; padding: 5px; gap: 5px; overflow: hidden; }

        /* PANNEAU GAUCHE */
        aside { width: 180px; background: white; border: 2px inset #fff; display: flex; flex-direction: column; }
        .list-header { background: #848484; color: white; font-size: 11px; padding: 3px; font-weight: bold; }
        .contacts { flex: 1; padding: 5px; font-size: 12px; }
        .user-item { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .online { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; border: 1px solid #000; }

        /* CHAT */
        main { flex: 1; background: white; border: 2px inset #fff; display: flex; flex-direction: column; }
        #chat-scroller { flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; background: #fff; }
        .msg { margin-bottom: 5px; border-bottom: 1px solid #f0f0f0; padding-bottom: 2px; }

        /* INPUT */
        .input-box { background: #D4D0C8; padding: 8px; display: flex; gap: 5px; border-top: 1px solid #848484; }
        input { flex: 1; border: 2px inset #fff; padding: 4px; font-size: 13px; }

        .btn { 
            background: #D4D0C8; border: 2px solid; border-color: #fff #848484 #848484 #fff;
            padding: 3px 10px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn:active { border-color: #848484 #fff #fff #848484; }

        /* MODAL SETTINGS */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; }
        .dialog { background: #D4D0C8; border: 2px solid #fff; border-right-color: #404040; border-bottom-color: #404040; padding: 15px; width: 250px; }
    </style>
</head>
<body>

    <header>
        <div class="rbx-logo">ROBLOX</div>
        <button class="btn" onclick="openCfg()">Propriétés</button>
    </header>

    <div class="app-window">
        <div class="title-bar"><span>LANOU-CORD v2.10</span><button style="background:red; color:white; border:1px solid white; cursor:pointer;">X</button></div>
        
        <div class="main-content">
            <aside>
                <div class="list-header">Contacts</div>
                <div class="contacts">
                    <div class="user-item"><div class="online"></div> <b>LANOU (Admin)</b></div>
                    <div class="user-item"><div class="online" style="background:#00a2ff"></div> <b>GeminiBot</b></div>
                    <hr>
                    <div id="friends"></div>
                    <button class="btn" style="width:100%" onclick="addF()">+ Ajouter</button>
                </div>
            </aside>

            <main>
                <div id="chat-scroller"></div>
                <div class="input-box">
                    <input type="text" id="msg-input" placeholder="Ecrivez un message...">
                    <button class="btn" id="send-btn">Envoyer</button>
                </div>
            </main>
        </div>
    </div>

    <div id="modal">
        <div class="dialog">
            <b>Paramètres</b><hr>
            Pseudo:<br><input type="text" id="new-name" style="width:100%"><br><br>
            Couleur:<br><input type="color" id="new-color" style="width:100%"><br><br>
            <button class="btn" onclick="saveCfg()">OK</button>
            <button class="btn" onclick="closeCfg()">Annuler</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        let my = {
            name: localStorage.getItem('u_name') || "Anonyme",
            color: localStorage.getItem('u_color') || "#ff0000"
        };

        function openCfg() { document.getElementById('new-name').value = my.name; document.getElementById('modal').style.display='flex'; }
        function closeCfg() { document.getElementById('modal').style.display='none'; }
        function saveCfg() {
            my.name = document.getElementById('new-name').value || my.name;
            my.color = document.getElementById('new-color').value;
            localStorage.setItem('u_name', my.name);
            localStorage.setItem('u_color', my.color);
            closeCfg();
        }

        async function send() {
            const i = document.getElementById('msg-input');
            const txt = i.value.trim();
            if(!txt) return;
            i.value = "";

            // Envoi de ton message
            await client.from('messages').insert([{ username: my.name, content: txt, user_color: my.color }]);

            // RÉPONSE AUTOMATIQUE GEMINI
            if(txt.toLowerCase().includes("@gemini")) {
                setTimeout(async () => {
                    await client.from('messages').insert([{ 
                        username: "Gemini", 
                        content: "Je suis là ! On a refait la déco, c'est plus propre non ? B) ", 
                        user_color: "#00a2ff" 
                    }]);
                }, 800);
            }
        }

        document.getElementById('send-btn').onclick = send;
        document.getElementById('msg-input').onkeydown = (e) => { if(e.key==='Enter') send(); };

        function render(m) {
            const sc = document.getElementById('chat-scroller');
            const d = document.createElement('div');
            d.className = "msg";
            d.innerHTML = `<b style="color:${m.user_color}">${m.username}:</b> ${m.content}`;
            sc.appendChild(d);
            sc.scrollTop = sc.scrollHeight;
        }

        async function init() {
            const { data } = await client.from('messages').select('*').order('created_at', {ascending: true}).limit(50);
            if(data) data.forEach(render);
            client.channel('chat').on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => render(p.new)).subscribe();
        }
        init();
    </script>
</body>
</html>
