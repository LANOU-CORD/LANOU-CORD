<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD | NEXUS EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main: #00ffcc;
            --bg: #0b0b0d;
            --panel: #111214;
            --sidebar: #000000;
            --hover: #35373d;
            --text-muted: #b9bbbe;
            --laser: 0 0 20px var(--main);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* BARRE SERVEURS */
        .srv-nav { width: 72px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; border-right: 1px solid #111; }
        .srv-icon { width: 48px; height: 48px; background: #2b2d31; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; font-weight: 900; color: white; border: none; font-size: 18px; }
        .srv-icon:hover, .srv-icon.active { border-radius: 15px; background: var(--main); color: black; box-shadow: var(--laser); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: 800; color: var(--main); text-shadow: 0 0 10px var(--main); border-bottom: 1px solid #1e1f22; font-size: 14px; text-transform: uppercase; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
        .cat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 18px 0 6px 4px; display: flex; justify-content: space-between; align-items: center; }
        .item { padding: 8px 10px; border-radius: 5px; cursor: pointer; color: #8e9297; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; transition: 0.2s; }
        .item:hover { background: var(--hover); color: white; }
        .item.active { background: #3f4248; color: white; }

        /* ZONE UTILISATEUR */
        .user-panel { padding: 8px; background: #232428; display: flex; align-items: center; gap: 8px; border-top: 1px solid #1e1f22; }
        .u-ava-container { position: relative; cursor: pointer; }
        .u-ava { width: 32px; height: 32px; border-radius: 50%; background: var(--main); }
        .u-status { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #232428; background: #43b581; }
        .u-info { flex: 1; cursor: pointer; overflow: hidden; }
        .u-name { font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

        /* CHAT */
        .main { flex: 1; display: flex; flex-direction: column; background: #313338; position: relative; }
        .top-nav { height: 48px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid #26272b; font-weight: 600; gap: 15px; }
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        .message { display: flex; gap: 16px; animation: msgIn 0.3s ease; }
        .m-ava { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        .m-user { font-weight: 600; color: white; margin-right: 8px; }
        .m-time { font-size: 11px; color: var(--text-muted); }
        .m-text { color: #dcddde; margin-top: 4px; line-height: 1.4; word-break: break-all; }

        .input-area { padding: 0 20px 24px 20px; }
        .input-box { background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 11px 16px; gap: 15px; }
        #main-input { background: transparent; border: none; color: white; flex: 1; outline: none; font-size: 15px; }

        /* PARAMETRES MODAL */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal { background: #18191c; width: 480px; border-radius: 8px; overflow: hidden; }
        .m-banner { height: 100px; background: var(--main); position: relative; }
        .m-ava-big { width: 80px; height: 80px; border-radius: 50%; border: 6px solid #18191c; position: absolute; bottom: -40px; left: 20px; }
        .m-body { padding: 50px 20px 20px 20px; }
        input, textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; margin: 10px 0; outline: none; }
        .btn-save { background: var(--main); color: black; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: 800; cursor: pointer; }

        .discord-btn { position: absolute; top: 10px; right: 20px; background: #5865F2; padding: 8px 15px; border-radius: 4px; color: white; text-decoration: none; font-weight: bold; font-size: 12px; transition: 0.3s; }
        .discord-btn:hover { background: #4752c4; box-shadow: 0 0 15px rgba(88, 101, 242, 0.5); }
    </style>
</head>
<body>

    <nav class="srv-nav">
        <button class="srv-icon active">LS</button>
        <div style="width:32px; height:2px; background:#333;"></div>
        <button class="srv-icon" style="color:#43b581;" onclick="createRoom()">+</button>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-header">Lanou-Cord Studio</div>
        <div class="scroll-area">
            <div class="item" id="btn-friends">👥 Amis</div>
            <div class="cat-label"><span>Salons Textuels</span></div>
            <div id="channels-list"></div>
        </div>
        <div class="user-panel">
            <div class="u-ava-container" onclick="openSettings()">
                <div class="u-ava" id="my-ava"></div>
                <div class="u-status"></div>
            </div>
            <div class="u-info" onclick="openSettings()">
                <div class="u-name" id="my-name">Chargement...</div>
                <div style="font-size:10px; color:var(--text-muted)">#<span id="my-id"></span></div>
            </div>
            <div style="cursor:pointer" onclick="openSettings()">⚙️</div>
        </div>
    </aside>

    <main class="main">
        <a href="https://discord.gg/6Zq7GKypYy" target="_blank" class="discord-btn">REJOINDRE LE DISCORD</a>
        <div class="top-nav">
            <span style="color:#72767d; font-size:24px;">#</span>
            <span id="nav-title">général</span>
        </div>
        <div id="messages-container"></div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="main-input" placeholder="Envoyer un message...">
            </div>
        </div>
    </main>

    <div id="modal-settings" class="overlay">
        <div class="modal">
            <div class="m-banner" id="m-ban-prev"><div class="m-ava-big" id="m-ava-prev"></div></div>
            <div class="m-body">
                <input type="text" id="set-name" placeholder="Pseudo...">
                <textarea id="set-bio" rows="2" placeholder="Bio..."></textarea>
                <div style="display:flex; gap:10px;">
                    <input type="color" id="set-color-ava" title="Avatar">
                    <input type="color" id="set-color-ban" title="Bannière">
                </div>
                <button class="btn-save" onclick="saveSettings()">ENREGISTRER</button>
                <button onclick="closeSettings()" style="background:none; border:none; color:#888; width:100%; margin-top:10px; cursor:pointer;">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co"; 
        const SB_KEY = "sb_publishable_CpPI_nOBqa4suV84Tp8-Mg__o63xMsu"; 
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let user = {
            id: localStorage.getItem('ln_id') || Math.floor(1000 + Math.random()*9000),
            name: localStorage.getItem('ln_name') || "User-" + Math.floor(Math.random()*999),
            color: localStorage.getItem('ln_color') || "#00ffcc",
            banner: localStorage.getItem('ln_banner') || "#004433"
        };
        localStorage.setItem('ln_id', user.id);
        let activeChannel = "général";

        function init() {
            updateUI(); loadChannels(); loadMessages();
            supabase.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new.channel===activeChannel)renderMessage(p.new)}).subscribe();
            supabase.channel('c').on('postgres_changes',{event:'INSERT',schema:'public',table:'channels'},()=>loadChannels()).subscribe();
        }

        function updateUI() {
            document.getElementById('my-name').innerText = user.name;
            document.getElementById('my-id').innerText = user.id;
            document.getElementById('my-ava').style.background = user.color;
            document.getElementById('m-ava-prev').style.background = user.color;
            document.getElementById('m-ban-prev').style.background = user.banner;
        }

        async function loadChannels() {
            const { data } = await supabase.from('channels').select('*');
            const list = document.getElementById('channels-list');
            list.innerHTML = "";
            data?.forEach(c => {
                const div = document.createElement('div');
                div.className = `item ${activeChannel === c.name ? 'active' : ''}`;
                div.innerHTML = `<span>#</span> ${c.name}`;
                div.onclick = () => { activeChannel = c.name; document.getElementById('nav-title').innerText=c.name; loadChannels(); loadMessages(); };
                list.appendChild(div);
            });
        }

        async function createRoom() {
            const n = prompt("Nom du salon :");
            if(n) await supabase.from('channels').insert([{ name: n.toLowerCase().trim() }]);
        }

        async function loadMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = "";
            const { data } = await supabase.from('messages').select('*').eq('channel', activeChannel).order('created_at', {ascending: true});
            data?.forEach(m => renderMessage(m));
        }

        function renderMessage(m) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = "message";
            div.innerHTML = `<div class="m-ava" style="background:${m.color}"></div><div class="m-content"><div class="m-header"><span class="m-user">${m.username}</span><span class="m-time">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="m-text">${m.content}</div></div>`;
            container.appendChild(div); container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const inp = document.getElementById('main-input');
            const val = inp.value.trim(); if(!val) return; inp.value = "";
            await supabase.from('messages').insert([{ username:user.name, content:val, color:user.color, channel:activeChannel }]);
        }

        function openSettings() { document.getElementById('modal-settings').style.display="flex"; }
        function closeSettings() { document.getElementById('modal-settings').style.display="none"; }
        function saveSettings() {
            user.name = document.getElementById('set-name').value;
            user.color = document.getElementById('set-color-ava').value;
            user.banner = document.getElementById('set-color-ban').value;
            localStorage.setItem('ln_name', user.name); localStorage.setItem('ln_color', user.color); localStorage.setItem('ln_banner', user.banner);
            updateUI(); closeSettings();
        }

        document.getElementById('main-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        init();
    </script>
</body>
</html>
