<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LANOU-CORD</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --rbx-blue: #00a2ff;
            --rbx-green: #02b757;
            --rbx-bg: #e3e3e3;
        }

        body { 
            margin: 0; 
            background: var(--rbx-bg) url('https://www.transparenttextures.com/patterns/cubes.png'); 
            font-family: 'Trebuchet MS', sans-serif;
            display: flex; 
            flex-direction: column;
            height: 100vh; 
        }

        /* Barre de Navigation Noire */
        .top-bar {
            height: 50px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar Salons avec bordure bleue */
        .sidebar { 
            width: 220px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px 10px;
            border-right: 4px solid var(--rbx-blue);
        }

        .channel-btn {
            background: #fff;
            border: 2px solid #ccc;
            border-bottom: 5px solid #bbb;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            border-radius: 10px;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .channel-btn:hover { background: #f9f9f9; }
        .channel-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .channel-btn.active { background: var(--rbx-blue); color: white; border-color: #0084ff; border-bottom-color: #005ea8; }

        /* Zone de Chat */
        .chat-section { flex: 1; display: flex; flex-direction: column; padding: 20px; }

        #messages { 
            flex: 1; 
            background: white; 
            border-radius: 15px; 
            border: 3px solid #ccc;
            box-shadow: 0 6px 0 #bbb;
            padding: 20px;
            overflow-y: auto;
        }

        .msg-bubble {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 6px solid var(--rbx-blue);
            font-size: 15px;
            animation: pop 0.2s ease-out;
        }

        @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Input et Bouton Envoyer */
        .input-box {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        input { 
            flex: 1; 
            padding: 15px; 
            border-radius: 12px; 
            border: 3px solid #ccc; 
            font-size: 16px;
            font-weight: bold;
            outline: none;
        }

        .send-btn {
            background: var(--rbx-green);
            color: white;
            border: none;
            border-bottom: 6px solid #018e43;
            padding: 0 35px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.1s;
        }

        .send-btn:hover { background: #03cf63; }
        .send-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    </style>
</head>

<div class="top-bar
