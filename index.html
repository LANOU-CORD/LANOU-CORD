<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ROBLOX-CORD 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --rbx-blue: #00a2ff;
            --rbx-green: #02b757;
            --rbx-bg: #e3e3e3;
        }

        body { 
            margin: 0; 
            background: var(--rbx-bg) url('https://www.transparenttextures.com/patterns/cubes.png'); 
            font-family: 'Trebuchet MS', sans-serif;
            display: flex; 
            flex-direction: column;
            height: 100vh; 
        }

        /* Barre de Navigation */
        .top-bar {
            height: 50px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Layout */
        .container { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar Salons */
        .sidebar { 
            width: 220px; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px 10px;
            border-right: 4px solid var(--rbx-blue);
        }

        .channel-btn {
            background: #fff;
            border: 2px solid #ccc;
            border-bottom: 5px solid #bbb;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .channel-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .channel-btn.active { background: var(--rbx-blue); color: white; border-color: #0084ff; border-bottom-color: #005ea8; }

        /* Chat */
        .chat-section { flex: 1; display: flex; flex-direction: column; padding: 20px; }

        #messages { 
            flex: 1; 
            background: white; 
            border-radius: 15px; 
            border: 3px solid #ccc;
            box-shadow: 0 6px 0 #bbb;
            padding: 20px;
            overflow-y: auto;
        }

        .msg-bubble {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 6px solid var(--rbx-blue);
            font-size: 15px;
        }

        /* Zone d'envoi */
        .input-box {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        input { 
            flex: 1; 
            padding: 15px; 
            border-radius: 12px; 
            border: 3px solid #ccc; 
            font-size: 16px;
            font-weight: bold;
        }

        .send-btn {
            background: var(--rbx-green);
            color: white;
            border: none;
            border-bottom: 6px solid #018e43;
            padding: 0 35px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .send-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
    </style>
</head>
<body>

<div class="top-bar">ROBLOX-CORD <span style="color: var(--rbx-blue); margin-left: 5px;">2026</span></div>

<div class="container">
    <div class="sidebar">
        <div id="channel-list"></div>
    </div>

    <div class="chat-section">
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Dire quelque chose...">
            <button class="send-btn" id="send-trigger">ENVOYER</button>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    let currentChannel = 'général';
    let myUser = prompt("Nom d'utilisateur :") || "Guest" + Math.floor(Math.random()*999);

    async function init() {
        await loadChannels();
        await loadMessages();
        supabase.channel('rbx').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
            if(p.new.channel === currentChannel) renderMessage(p.new);
        }).subscribe();
    }

    async function loadChannels() {
        const { data } = await supabase.from('channels').select('*');
        const list = document.getElementById('channel-list');
        list.innerHTML = "";
        data?.forEach(ch => {
            const div = document.createElement('div');
            div.className = `channel-btn ${currentChannel === ch.name ? 'active' : ''}`;
            div.innerText = ch.name;
            div.onclick = () => { currentChannel = ch.name; loadChannels(); loadMessages(); };
            list.appendChild(div);
        });
    }

    async function loadMessages() {
        const { data } = await supabase.from('messages').select('*').eq('channel', currentChannel).order('created_at', {ascending: true});
        const container = document.getElementById('messages');
        container.innerHTML = "";
        data?.forEach(m => renderMessage(m));
    }

    function renderMessage(m) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = "msg-bubble";
        div.innerHTML = `<span style="color:var(--rbx-blue); font-weight:bold;">${m.username}:</span> ${m.content}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function send() {
        const inp = document.getElementById('msg-input');
        if(inp.value.trim()) {
            const val = inp.value;
            inp.value = "";
            await supabase.from('messages').insert([{ username: myUser, content: val, channel: currentChannel }]);
        }
    }

    document.getElementById('send-trigger').onclick = send;
    document.getElementById('msg-input').onkeydown = (e) => { if(e.key === 'Enter') send(); };
    init();
</script>

</body>
</html>
