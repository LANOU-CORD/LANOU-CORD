<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD 2010 FIX</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --win-header: linear-gradient(to bottom, #74b0f0 0%, #1959d1 100%); --win-blue: #0053e1; }
        body { margin: 0; font-family: 'Tahoma', sans-serif; background: #3a6ea5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--win-header); height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; color: white; border-bottom: 2px solid #003da0; }
        
        .container { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }
        .win-panel { background: white; border: 2px solid var(--win-blue); border-radius: 5px 5px 0 0; display: flex; flex-direction: column; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
        
        /* Contacts */
        aside { width: 220px; }
        .win-header { background: var(--win-header); color: white; padding: 5px 10px; font-size: 12px; font-weight: bold; }
        .list { flex: 1; overflow-y: auto; padding: 10px; }
        .item { display: flex; align-items: center; gap: 8px; padding: 5px; border-bottom: 1px solid #eee; cursor: pointer; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #31ff31; }

        /* Chat */
        main { flex: 1; }
        #chat-scroller { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fff; }
        .bubble { padding: 8px 12px; border-radius: 10px; background: #f1f1f1; border: 1px solid #ccc; max-width: 80%; font-size: 13px; }
        .me { align-self: flex-end; background: #e1ffc7; border-color: #b7e88f; }

        .input-box { padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; display: flex; gap: 5px; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid var(--win-blue); }
        
        .btn { background: #eee; border: 1px solid #707070; padding: 4px 10px; cursor: pointer; font-size: 12px; }
        .btn:hover { background: #ddd; }

        /* Modal Paramètres */
        #modal-win { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-body { width: 300px; background: #ece9d8; border: 2px solid var(--win-blue); padding: 0; }
    </style>
</head>
<body>

    <header>
        <div>🌐 LANOU-CORD 2010</div>
        <div>
            <button class="btn" id="btn-open-cfg">🔧 Options</button>
            <button class="btn" onclick="location.reload()">Déconnexion</button>
        </div>
    </header>

    <div class="container">
        <aside class="win-panel">
            <div class="win-header">Contacts</div>
            <div class="list">
                <div class="item"><div class="dot"></div><b>LANOU</b></div>
                <div class="item"><div class="dot" style="background:#00a2ff"></div><b>Assistant</b></div>
                <hr>
                <div id="friends-list"></div>
                <button class="btn" style="width:100%" id="btn-add-friend">+ Ajouter ami</button>
            </div>
        </aside>

        <main class="win-panel">
            <div class="win-header">Discussion Globale</div>
            <div id="chat-scroller"></div>
            <div class="input-box">
                <input type="text" id="msg-in" placeholder="Message...">
                <button class="btn" style="background:var(--win-blue); color:white" id="btn-send">ENVOYER</button>
            </div>
        </main>
    </div>

    <div id="modal-win">
        <div class="modal-body win-panel">
            <div class="win-header">Paramètres</div>
            <div style="padding:15px">
                <label>Pseudo :</label><br>
                <input type="text" id="new-name" style="width:95%"><br><br>
                <label>Couleur :</label><br>
                <input type="color" id="new-color" style="width:95%"><br><br>
                <button class="btn" style="width:100%" id="btn-save-cfg">APPLIQUER</button>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIG
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        let user = {
            name: localStorage.getItem('u_name') || prompt("Ton pseudo ?") || "Anonyme",
            color: localStorage.getItem('u_color') || "#000000"
        };

        // 2. FONCTIONS BOUTONS (Fixées)
        document.getElementById('btn-open-cfg').onclick = () => {
            document.getElementById('new-name').value = user.name;
            document.getElementById('modal-win').style.display = 'flex';
        };

        document.getElementById('btn-save-cfg').onclick = () => {
            user.name = document.getElementById('new-name').value;
            user.color = document.getElementById('new-color').value;
            localStorage.setItem('u_name', user.name);
            localStorage.setItem('u_color', user.color);
            document.getElementById('modal-win').style.display = 'none';
            alert("Sauvegardé !");
        };

        document.getElementById('btn-add-friend').onclick = () => {
            let name = prompt("Pseudo de l'ami :");
            if(name) {
                const div = document.createElement('div');
                div.className = "item";
                div.innerHTML = `<div class="dot" style="background:gray"></div><b>${name}</b>`;
                document.getElementById('friends-list').appendChild(div);
                alert("Demande envoyée !");
            }
        };

        // 3. ENVOI MESSAGE
        async function send() {
            const input = document.getElementById('msg-in');
            const txt = input.value.trim();
            if(!txt) return;

            input.value = "";
            const { error } = await client.from('messages').insert([{ 
                username: user.name, 
                content: txt, 
                user_color: user.color 
            }]);
            if(error) alert("Erreur Supabase : " + error.message);
        }

        document.getElementById('btn-send').onclick = send;
        document.getElementById('msg-in').onkeydown = (e) => { if(e.key === 'Enter') send(); };

        // 4. AFFICHAGE
        function render(m) {
            const box = document.getElementById('chat-scroller');
            const div = document.createElement('div');
            div.className = `bubble ${m.username === user.name ? 'me' : ''}`;
            div.innerHTML = `<b style="color:${m.user_color}">${m.username}</b>: ${m.content}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 5. DEMARRAGE
        async function start() {
            const { data } = await client.from('messages').select('*').order('created_at', {ascending: true}).limit(50);
            if(data) data.forEach(render);

            client.channel('chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                render(p.new);
            }).subscribe();
        }

        start();
    </script>
</body>
</html>
