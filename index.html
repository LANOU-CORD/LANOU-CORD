<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD - Maintenance</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            margin: 0; 
            background: #313338; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            overflow: hidden;
        }

        .update-overlay {
            text-align: center;
            background: #2b2d31;
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #5865f2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #5865f2;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 { color: #5865f2; margin: 10px 0; }
        p { color: #b5bac1; font-size: 1.1em; }
        
        .progress-bar {
            width: 100%;
            background: #1e1f22;
            height: 10px;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 45%;
            height: 100%;
            background: #5865f2;
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 10%; }
            50% { width: 80%; }
            100% { width: 10%; }
        }
    </style>
</head>
<body>

    <div class="update-overlay">
        <div class="spinner"></div>
        <h1>LANOU-CORD</h1>
        <p>🚀 Mise à jour en cours...</p>
        <p style="font-size: 0.8em;">Installation des nouveaux serveurs et sécurisation des salons.</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

</body>
</html>
