<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LANOU-CORD | REBOOT SYSTEM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* SECTION : DESIGN CYBERPUNK ULTIME
           Optimisé pour la vitesse et le style.
        */
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff88;
            --bg-black: #000205;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --glow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        /* THEMES DYNAMIQUES */
        body.theme-blue { --accent: var(--neon-blue); --bg-gradient: radial-gradient(circle, #001529 0%, #000205 100%); }
        body.theme-green { --accent: var(--neon-green); --bg-gradient: radial-gradient(circle, #001a0a 0%, #000205 100%); }
        body.theme-red { --accent: var(--neon-pink); --bg-gradient: radial-gradient(circle, #1a0005 0%, #000205 100%); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: 0.5s;
        }

        /* HEADER */
        header {
            height: 70px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            z-index: 1000;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        /* BARRE DE NEWS */
        .news-bar {
            height: 35px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .news-slider {
            white-space: nowrap;
            animation: slide 40s linear infinite;
            color: var(--accent);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        @keyframes slide {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* MISE EN PAGE */
        .app-wrapper {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* SIDEBAR */
        aside {
            width: 280px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-title {
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .item {
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .item:hover {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--accent);
        }

        /* MESSAGERIE */
        .main-chat {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-flow {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* STYLES MESSAGES */
        .msg-wrap {
            max-width: 75%;
            display: flex;
            gap: 15px;
            animation: bounceIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .msg-wrap.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            border: 2px solid var(--accent);
            object-fit: cover;
            box-shadow: 0 0 10px var(--accent);
        }

        .bubble {
            padding: 15px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            line-height: 1.6;
        }

        .me .bubble {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--accent);
        }

        .name-label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* ZONE SAISIE */
        .bottom-bar {
            padding: 30px;
            background: rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
        }

        .main-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .main-input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }

        .btn {
            padding: 0 30px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-blue { background: var(--accent); color: #000; }
        .btn-blue:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--accent); }

        /* MODALS */
        .full-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #000810;
            border: 2px solid var(--accent);
            padding: 50px;
            border-radius: 40px;
            text-align: center;
            width: 400px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }

        .pfp-pick {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            margin-bottom: 30px;
            cursor: pointer;
            object-fit: cover;
        }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>

<body class="theme-blue">

    <header>
        <div class="logo-box">
            <div class="logo-text">LANOU-CORD</div>
        </div>
        <button class="btn btn-blue" onclick="showSet(true)">Settings</button>
    </header>

    <div class="news-bar">
        <div class="news-slider">
            SYSTEM STATUS: ONLINE | ENCRYPTION: ACTIVE | PERSISTENCE ENGINE: LOADED | WELCOME TO THE FUTURE OF CHAT |
        </div>
    </div>

    <div class="app-wrapper">
        <aside>
            <div class="side-title">CHANNELS</div>
            <div class="item"># GENERAL-HUB</div>
            <div class="item" style="opacity: 0.3"># SECURE-VAULT</div>
            
            <div class="side-title" style="margin-top:30px">ACTIVE USERS</div>
            <div class="item">👤 LANOU (Host)</div>
        </aside>

        <main class="main-chat">
            <div id="chat-flow"></div>
            
            <div class="bottom-bar">
                <input type="file" id="file-up" style="display:none" onchange="fileTrans()">
                <button class="btn" style="background:#222; color:white;" onclick="document.getElementById('file-up').click()">📎</button>
                <input type="text" id="user-msg" class="main-input" placeholder="Type a message...">
                <button class="btn btn-blue" id="send-trigger">TRANSMIT</button>
            </div>
        </main>
    </div>

    <div id="auth-modal" class="full-screen" style="display: flex;">
        <div class="login-box">
            <h1 style="color:var(--accent); margin-bottom:20px; letter-spacing:3px;">IDENTIFICATION</h1>
            
            <img id="pfp-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="pfp-pick" onclick="document.getElementById('pfp-input').click()">
            <input type="file" id="pfp-input" style="display:none" accept="image/*" onchange="preview(this)">
            
            <input type="text" id="user-name" class="main-input" style="width:100%; margin-bottom: 25px; text-align:center;" placeholder="Enter Username...">
            
            <button class="btn btn-blue" style="width:100%; height:60px;" onclick="tryLogin()">ACCÉDER AU RÉSEAU</button>
        </div>
    </div>

    <div id="set-modal" class="full-screen">
        <div class="login-box">
            <h2 style="color:var(--accent); margin-bottom:20px;">UI CONFIG</h2>
            <select id="theme-sel" class="main-input" style="width:100%; margin-bottom: 20px;">
                <option value="theme-blue">Neon Blue</option>
                <option value="theme-green">Toxic Green</option>
                <option value="theme-red">Fatal Red</option>
            </select>
            <button class="btn btn-blue" style="width:100%" onclick="saveSet()">APPLY</button>
            <button class="btn" style="width:100%; margin-top:10px; background:#333; color:white;" onclick="showSet(false)">CLOSE</button>
        </div>
    </div>

    <script>
        /* SECTION : JAVASCRIPT ENGINE (LIGNES 380-500)
           Gére la connexion Supabase et le bouton d'accès.
        */

        // CONFIGURATION SUPABASE
        const SUPA_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        let myState = {
            id: localStorage.getItem('lanou_id') || null,
            pfp: localStorage.getItem('lanou_pfp') || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
            theme: localStorage.getItem('lanou_theme') || "theme-blue"
        };

        const alertSnd = new Audio('https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Notification/master/notification.mp3');

        // FORCE START : Vérifie si on est déjà connecté au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Système prêt.");
            if (myState.id) {
                document.getElementById('auth-modal').style.display = 'none';
                document.body.className = myState.theme;
                startEngine();
            }
        });

        // FONCTION LOGIN (Celle appelée par le bouton)
        function tryLogin() {
            console.log("Tentative de connexion...");
            const name = document.getElementById('user-name').value.trim();
            
            if (name === "") {
                alert("Erreur : Pseudo vide !");
                return;
            }

            // Enregistrement Local
            myState.id = name;
            localStorage.setItem('lanou_id', name);
            localStorage.setItem('lanou_pfp', myState.pfp);

            // Cacher le modal
            document.getElementById('auth-modal').style.display = 'none';
            console.log("Accès accordé à : " + name);

            // Lancer le moteur
            startEngine();
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('pfp-preview').src = e.target.result;
                    myState.pfp = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // MOTEUR DE CHAT
        async function startEngine() {
            // 1. Charger l'historique Supabase
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (!error && data) {
                document.getElementById('chat-flow').innerHTML = "";
                data.forEach(m => render(m));
            }

            // 2. Ecouteur Realtime
            supabase.channel('room1')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    if (payload.new.username !== myState.id) {
                        render(payload.new);
                        alertSnd.play().catch(()=>{});
                    }
                })
                .subscribe();
        }

        async function transmit() {
            const input = document.getElementById('user-msg');
            const val = input.value.trim();
            if (!val) return;

            const pack = {
                username: myState.id,
                content: val,
                avatar_url: myState.pfp
            };

            // Rendu local immédiat
            render(pack);
            input.value = "";

            // Sauvegarde Cloud
            const { error } = await supabase.from('messages').insert([pack]);
            if (error) console.error("Erreur de sauvegarde Cloud.");
        }

        function render(m) {
            const flow = document.getElementById('chat-flow');
            const isMe = m.username === myState.id;
            
            const wrap = document.createElement('div');
            wrap.className = `msg-wrap ${isMe ? 'me' : ''}`;
            
            wrap.innerHTML = `
                <img src="${m.avatar_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar">
                <div class="bubble">
                    <span class="name-label">${m.username}</span>
                    <div class="text">${m.content}</div>
                </div>
            `;

            flow.appendChild(wrap);
            flow.scrollTop = flow.scrollHeight;
        }

        function showSet(b) { document.getElementById('set-modal').style.display = b ? 'flex' : 'none'; }
        
        function saveSet() {
            myState.theme = document.getElementById('theme-sel').value;
            localStorage.setItem('lanou_theme', myState.theme);
            document.body.className = myState.theme;
            showSet(false);
        }

        function fileTrans() {
            const f = document.getElementById('file-up').files[0];
            if(f) {
                document.getElementById('user-msg').value = "📁 FICHIER : " + f.name;
                transmit();
            }
        }

        // Ecouteurs Clavier
        document.getElementById('send-trigger').onclick = transmit;
        document.getElementById('user-msg').onkeydown = (e) => { if (e.key === 'Enter') transmit(); };

    </script>
</body>
</html>
