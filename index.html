<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LANOU-CORD Edition</title>

    <style>
        body { 
            margin: 0; padding: 0; background: #e3e3e3; 
            font-family: 'Verdana', sans-serif;
            display: flex; flex-direction: column; align-items: center; height: 100vh;
        }

        /* BANNIÈRE AVEC TON LIEN DISCORD */
        #header-banniere {
            width: 100%; height: 120px;
            background: linear-gradient(to bottom, #75aadb 0%, #ffffff 100%), url('https://www.transparenttextures.com/patterns/city.png');
            border-bottom: 3px solid #0055ff;
            display: flex; position: relative;
            justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo-text {
            font-size: 42px; font-weight: 900; color: #ff3131;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            letter-spacing: -2px; margin: 0;
        }

        .edition-text {
            font-size: 18px; color: #0055ff; font-weight: bold;
            position: absolute; bottom: 15px; transform: rotate(-2deg);
            background: yellow; padding: 2px 10px; border: 1px solid black;
        }

        /* LE BOUTON SERVEUR CORRIGÉ */
        .discord-btn {
            position: absolute; right: 20px; top: 20px;
            background: linear-gradient(to bottom, #3dbd3d 0%, #1d8f1d 100%);
            border: 2px solid #ffffff; border-radius: 5px;
            color: white; font-weight: bold; font-size: 13px;
            padding: 10px 15px; cursor: pointer;
            text-decoration: none; text-align: center;
            box-shadow: 0 4px 0 #125a12;
            transition: 0.1s;
        }
        .discord-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #125a12; }

        /* Conteneur principal */
        .container { 
            display: flex; flex: 1; width: 95%; max-width: 1100px;
            background: white; margin: 20px 0; border-radius: 10px;
            overflow: hidden; border: 2px solid #555;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* SIDEBAR PROFIL & AMIS */
        .sidebar { width: 230px; background: #f0f0f0; padding: 20px; border-right: 2px solid #ccc; }
        
        .user-card {
            background: #fff; border: 2px solid #ccc; border-bottom: 4px solid #999;
            border-radius: 10px; padding: 10px; margin-bottom: 20px; text-align: center;
        }
        .avatar-circle {
            width: 50px; height: 50px; background: #f0f000; border: 2px solid #000;
            border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; 
            justify-content: center; font-size: 24px;
        }

        .friends-title { font-weight: bold; font-size: 12px; color: #666; margin-bottom: 10px; text-align: center; }
        .friend-item {
            background: #fff; border: 1px solid #ddd; padding: 8px; margin-bottom: 5px;
            border-radius: 4px; display: flex; align-items: center; font-size: 12px; font-weight: bold;
        }
        .status-dot { width: 8px; height: 8px; background: #02b757; border-radius: 50%; margin-right: 8px; }

        /* CHAT */
        .chat-section { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #messages { flex: 1; background: #fff; border: 1px solid #ccc; padding: 15px; overflow-y: auto; border-radius: 5px; }
        .msg-bubble { margin-bottom: 10px; padding: 5px; border-bottom: 1px dotted #eee; font-size: 14px; }

        .input-box { margin-top: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 5px; font-weight: bold; outline: none; }
        .send-btn {
            background: #02b757; color: white; border: none;
            border-bottom: 4px solid #01853e; padding: 0 25px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
