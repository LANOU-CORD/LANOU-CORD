<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD 2026 | Future Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* DESIGN FUTURISTE 2026 */
        :root {
            --neon-blue: #00f2ff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #001a33 0%, #00050a 100%);
            color: white; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        header {
            width: 100%; height: 50px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-blue);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .logo {
            font-weight: 900; font-size: 20px; letter-spacing: 2px;
            text-transform: uppercase; color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .app-container {
            margin-top: 40px;
            width: 850px; height: 550px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        aside {
            width: 220px; background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid transparent; transition: 0.3s;
        }
        .contact-card:hover { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.1); }

        .status { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }

        main { flex: 1; display: flex; flex-direction: column; }

        #chat-scroller {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
        }

        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 15px;
            font-size: 14px; line-height: 1.5;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            word-wrap: break-word;
        }
        .message.me { align-self: flex-end; border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.1); }
        
        /* Style pour les images dans le chat */
        .chat-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .input-bar {
            padding: 20px; background: rgba(0,0,0,0.3);
            display: flex; gap: 10px;
        }

        input {
            flex: 1; background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border); border-radius: 10px;
            padding: 12px; color: white; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .btn-send {
            background: var(--neon-blue); border: none; border-radius: 10px;
            padding: 0 20px; font-weight: bold; cursor: pointer;
            color: #000; transition: 0.3s;
        }
        .btn-send:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--neon-blue); }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #001a33; border: 1px solid var(--neon-blue);
            padding: 30px; border-radius: 20px; width: 300px;
            text-align: center; box-shadow: 0 0 30px var(--neon-blue);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">LANOU-CORD <span style="font-weight: 200;">2026</span></div>
        <button class="btn-send" style="padding: 5px 15px;" onclick="openSettings()">PROPRIÉTÉS</button>
    </header>

    <div class="app-container">
        <div class="main-layout">
            <aside>
                <h3 style="font-size: 12px; color: var(--neon-blue); margin-bottom: 20px;">CHANNELS</h3>
                <div class="contact-card">
                    <div class="status" style="color: #00ff88; background: #00ff88;"></div>
                    <span>LANOU (Admin)</span>
                </div>
                <div class="contact-card">
                    <div class="status" style="color: var(--neon-blue); background: var(--neon-blue);"></div>
                    <span>Gemini AI</span>
                </div>
            </aside>

            <main>
                <div id="chat-scroller"></div>
                <div class="input-bar">
                    <input type="text" id="user-input" placeholder="Transmission cryptée...">
                    <button class="btn-send" id="send-btn">ENVOYER</button>
                </div>
            </main>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 style="color: var(--neon-blue);">INTERFACE ID</h2>
            <input type="text" id="new-name" placeholder="Nouveau Pseudo" style="width: 100%; margin-bottom: 10px;">
            <input type="color" id="new-color" style="width: 100%; height: 40px; border-radius: 5px; margin-bottom: 20px;">
            <div style="display: flex; gap: 10px;">
                <button class="btn-send" style="flex: 1;" onclick="saveSettings()">OK</button>
                <button class="btn-send" style="flex: 1; background: #555; color: white;" onclick="closeSettings()">ANNULER</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        let user = {
            name: localStorage.getItem('u_2026') || "Cyber_User",
            color: localStorage.getItem('c_2026') || "#00f2ff"
        };

        function openSettings() { document.getElementById('modal').style.display='flex'; }
        function closeSettings() { document.getElementById('modal').style.display='none'; }
        
        function saveSettings() {
            user.name = document.getElementById('new-name').value || user.name;
            user.color = document.getElementById('new-color').value;
            localStorage.setItem('u_2026', user.name);
            localStorage.setItem('c_2026', user.color);
            closeSettings();
        }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if(!val) return;
            input.value = "";

            await client.from('messages').insert([{ username: user.name, content: val, user_color: user.color }]);

            // LOGIQUE GÉNÉRATEUR INFINI @GEMINI
            if(val.toLowerCase().includes("@gemini")) {
                let maReponse = "";
                const v = val.toLowerCase();

                // NOUVEAU : BIDULE IMAGE
                if(v.includes("image") || v.includes("photo")) {
                    // Gemini envoie une image d'arrière-plan futuriste
                    maReponse = "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=600&auto=format&fit=crop"; 
                } 
                else if(v.includes("devoir") || v.includes("récit") || v.includes("histoire")) {
                    // GÉNÉRATEUR DE RÉCITS (Milliers de combinaisons)
                    const intros = ["Ok, voilà ton récit : 'L'explorateur ", "D'accord ! 'Le guerrier ", "Transmission reçue : 'Le hacker ", "Initialisation : 'Le pilote "];
                    const heros = ["Lanou ", "Cyber-Lanou ", "L'agent secret Lanou ", "Le magicien Lanou "];
                    const actions = ["traversa la frontière de ", "détruisit le pare-feu de ", "s'infiltra dans la base de ", "découvrit le secret de ", "reprogramma le coeur de "];
                    const lieux = ["Néon-City... ", "la Matrice 2026... ", "la Planète Supabase... ", "l'Empire du Code... ", "la Dimension Glass... "];
                    const fins = ["C'était le début d'une ère nouvelle.'", "Le destin du monde changea à jamais.'", "Personne ne revit jamais l'ancien code.'", "La victoire était totale.'"];

                    const r1 = intros[Math.floor(Math.random() * intros.length)];
                    const r2 = heros[Math.floor(Math.random() * heros.length)];
                    const r3 = actions[Math.floor(Math.random() * actions.length)];
                    const r4 = lieux[Math.floor(Math.random() * lieux.length)];
                    const r5 = fins[Math.floor(Math.random() * fins.length)];

                    maReponse = r1 + r2 + r3 + r4 + r5;
                } else {
                    const chats = [
                        "Protocol 2026 activé. Interface optimisée. Comment puis-je vous aider ?",
                        "Système opérationnel. Prêt pour la suite Lanou.",
                        "Je traite tes données en temps réel. B)",
                        "L'interface 2026 est stable. Tu gères !",
                        "Transmission cryptée reçue. Je reste aux aguets."
                    ];
                    maReponse = chats[Math.floor(Math.random() * chats.length)];
                }

                setTimeout(async () => {
                    await client.from('messages').insert([{ 
                        username: "Gemini AI", 
                        content: maReponse, 
                        user_color: "#00f2ff" 
                    }]);
                }, 800);
            }
        }

        document.getElementById('send-btn').onclick = sendMsg;
        document.getElementById('user-input').onkeydown = (e) => { if(e.key==='Enter') sendMsg(); };

        // NOUVEAU : Fonction pour vérifier si une chaîne est une URL d'image
        function isImageUrl(url) {
            return (url.match(/\.(jpeg|jpg|gif|png|webp)$/) != null) || url.startsWith('https://images.unsplash.com');
        }

        function render(m) {
            const chat = document.getElementById('chat-scroller');
            const div = document.createElement('div');
            const isMe = m.username === user.name;
            div.className = `message ${isMe ? 'me' : ''}`;
            
            // MODIFIÉ : Gestion de l'affichage du contenu (texte ou image)
            let messageContent = m.content;
            if (isImageUrl(m.content)) {
                messageContent = `<img src="${m.content}" class="chat-image" alt="Image partagée">`;
            }

            div.innerHTML = `<b style="color:${m.user_color}">${m.username}</b><br>${messageContent}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function load() {
            const { data } = await client.from('messages').select('*').order('created_at', {ascending: true}).limit(50);
            if(data) data.forEach(render);
            client.channel('any').on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => render(p.new)).subscribe();
        }
        load();
    </script>
</body>
</html>
