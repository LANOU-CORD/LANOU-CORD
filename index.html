<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    
    <title>LANOU-CORD | CORE 2026</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ---------------------------------------------------------
           SECTION : DESIGN ATOMIQUE & CSS (LIGNES 30-180)
        --------------------------------------------------------- */
        :root {
            --neon-blue: #00f2ff;
            --neon-glow: 0 0 20px rgba(0, 242, 255, 0.4);
            --bg-dark: #000810;
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --msg-me: rgba(0, 242, 255, 0.12);
            --msg-them: rgba(255, 255, 255, 0.05);
        }

        /* DYNAMISME DES THEMES */
        body.theme-blue { --neon-blue: #00f2ff; --bg: radial-gradient(circle, #001a33 0%, #00050a 100%); }
        body.theme-green { --neon-blue: #00ff88; --bg: radial-gradient(circle, #001a0a 0%, #00050a 100%); }
        body.theme-red { --neon-blue: #ff0055; --bg: radial-gradient(circle, #1a0005 0%, #00050a 100%); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: 0.5s ease;
        }

        /* HEADER & NAVIGATION */
        header {
            height: 65px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .sys-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--neon-blue);
            text-shadow: var(--neon-glow);
        }

        /* NEWS TICKER */
        .marquee-zone {
            width: 100%;
            height: 38px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .marquee-track {
            white-space: nowrap;
            padding-left: 100%;
            animation: slide-text 35s linear infinite;
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: 700;
        }

        @keyframes slide-text {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .badge-info {
            background: var(--neon-blue);
            color: #000;
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 11px;
            margin-right: 15px;
        }

        /* MAIN APP LAYOUT */
        .app-core {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* BARRE LATERALE */
        .sidebar {
            width: 260px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 25px;
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sidebar h5 {
            color: var(--neon-blue);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .channel {
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .channel:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--neon-blue);
        }

        /* CHAT VIEWPORT */
        .chat-main {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        #messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* BUBBLE STYLES */
        .msg-block {
            max-width: 80%;
            display: flex;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-block.me { align-self: flex-end; flex-direction: row-reverse; }

        .avatar-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            object-fit: cover;
            box-shadow: var(--neon-glow);
        }

        .bubble-content {
            background: var(--msg-them);
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            line-height: 1.5;
            position: relative;
        }

        .me .bubble-content {
            background: var(--msg-me);
            border-color: var(--neon-blue);
            border-bottom-right-radius: 4px;
        }

        .user-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--neon-blue);
            display: block;
            margin-bottom: 5px;
        }

        /* INPUT AREA */
        .dock-bar {
            padding: 25px;
            background: rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--glass-border);
        }

        .input-field {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px 20px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--neon-blue);
            background: rgba(255,255,255,0.1);
        }

        .btn-core {
            padding: 0 25px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send { background: var(--neon-blue); color: #000; }
        .btn-send:hover { transform: scale(1.05); box-shadow: var(--neon-glow); }

        /* MODALS */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-box {
            background: #001226;
            border: 2px solid var(--neon-blue);
            padding: 40px;
            border-radius: 30px;
            width: 380px;
            text-align: center;
        }

        .pfp-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            margin-bottom: 25px;
            cursor: pointer;
            object-fit: cover;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>

<body class="theme-blue">

    <header>
        <div class="sys-logo">LANOU-CORD CORE</div>
        <button class="btn-core btn-send" style="height: 40px; font-size: 11px;" onclick="openSettings()">PARAMÈTRES</button>
    </header>

    <div class="marquee-zone">
        <div class="marquee-track" id="ticker-text">
            <span class="badge-info">SYNC_ON</span> RÉSEAU SÉCURISÉ — TOUS LES SYSTÈMES SONT OPÉRATIONNELS — SAUVEGARDE CLOUD ACTIVÉE — VERSION 6.5 —
        </div>
    </div>

    <div class="app-core">
        <aside class="sidebar">
            <h5>Fréquences</h5>
            <div class="channel">🟢 GÉNÉRAL</div>
            <div class="channel" style="opacity:0.4">🔒 ARCHIVES</div>
            
            <h5 style="margin-top:20px;">Utilisateurs</h5>
            <div class="channel">👤 LANOU (ADMIN)</div>
        </aside>

        <main class="chat-main">
            <div id="messages-container"></div>
            
            <div class="dock-bar">
                <input type="file" id="file-hidden" style="display:none" onchange="handleFile()">
                <button class="btn-core" style="background:#222; color:#fff" onclick="document.getElementById('file-hidden').click()">📎</button>
                <input type="text" id="msg-input" class="input-field" placeholder="Transmettre un signal...">
                <button class="btn-core btn-send" id="btn-transmit">ENVOYER</button>
            </div>
        </main>
    </div>

    <div id="login-modal" class="overlay" style="display: flex;">
        <div class="modal-box">
            <h2 style="color:var(--neon-blue); margin-bottom: 25px;">IDENTIFICATION</h2>
            <img id="login-pfp-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="pfp-preview" onclick="document.getElementById('login-pfp-input').click()">
            <input type="file" id="login-pfp-input" style="display:none" accept="image/*" onchange="previewImg(this, 'login-pfp-img')">
            
            <input type="text" id="login-name" class="input-field" style="width:100%; margin-bottom: 25px;" placeholder="Désignation (Pseudo)">
            <button class="btn-core btn-send" style="width:100%; height:50px;" onclick="registerCore()">ACCÉDER AU RÉSEAU</button>
        </div>
    </div>

    <div id="settings-modal" class="overlay">
        <div class="modal-box">
            <h2 style="color:var(--neon-blue); margin-bottom: 25px;">CONFIGURATION</h2>
            <select id="theme-select" class="input-field" style="width:100%; margin-bottom: 25px;">
                <option value="theme-blue">Néon Blue (Core)</option>
                <option value="theme-green">Toxic Green</option>
                <option value="theme-red">Fatal Red</option>
            </select>
            <button class="btn-core btn-send" style="width:100%; margin-bottom: 15px;" onclick="applySettings()">SAUVEGARDER</button>
            <button class="btn-core" style="width:100%; background:#333; color:#fff;" onclick="closeSettings()">FERMER</button>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION INITIALE
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let userState = {
            name: localStorage.getItem('lanou_name') || null,
            pfp: localStorage.getItem('lanou_pfp') || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
            theme: localStorage.getItem('lanou_theme') || "theme-blue"
        };

        const notify = new Audio('https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Notification/master/notification.mp3');

        // 2. LANCEMENT DU SYSTÈME
        window.addEventListener('DOMContentLoaded', () => {
            if (userState.name) {
                document.getElementById('login-modal').style.display = 'none';
                document.body.className = userState.theme;
                launchChat();
            }
        });

        // 3. GESTION DES MODALS ET IMAGES
        function previewImg(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(targetId).src = e.target.result;
                    userState.pfp = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function registerCore() {
            const name = document.getElementById('login-name').value.trim();
            if (!name) return alert("Identification requise !");
            
            userState.name = name;
            localStorage.setItem('lanou_name', name);
            localStorage.setItem('lanou_pfp', userState.pfp);
            
            document.getElementById('login-modal').style.display = 'none';
            launchChat();
        }

        function applySettings() {
            userState.theme = document.getElementById('theme-select').value;
            localStorage.setItem('lanou_theme', userState.theme);
            document.body.className = userState.theme;
            closeSettings();
        }

        // 4. MOTEUR DE CHAT ET PERSISTANCE (LE CŒUR)
        async function launchChat() {
            console.log("Système : Chargement de l'historique...");
            
            // Étape A : Charger les messages existants (POUR LE REFRESH)
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (error) {
                console.error("Erreur Supabase (Load):", error.message);
            } else {
                document.getElementById('messages-container').innerHTML = ""; // Nettoyage
                data.forEach(m => renderMessage(m));
            }

            // Étape B : Écouteur Temps Réel (Realtime)
            supabase.channel('room_general')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    // On ne rend que si ce n'est pas NOTRE message (déjà rendu localement)
                    if (payload.new.username !== userState.name) {
                        renderMessage(payload.new);
                        notify.play().catch(() => {});
                    }
                })
                .subscribe();
        }

        async function transmit() {
            const input = document.getElementById('msg-input');
            const val = input.value.trim();
            if (!val) return;

            // Commande Spéciale
            if (val.toLowerCase().startsWith('/news ')) {
                const txt = val.substring(6).toUpperCase();
                document.getElementById('ticker-text').innerHTML = `<span class="badge-info">INFO</span> ${txt} — `;
                input.value = ""; return;
            }

            const newMsg = {
                username: userState.name,
                content: val,
                avatar_url: userState.pfp,
                user_color: "var(--neon-blue)"
            };

            // 1. Rendu LOCAL IMMÉDIAT (Vitesse)
            renderMessage(newMsg);
            input.value = "";

            // 2. Sauvegarde CLOUD (Persistance)
            const { error } = await supabase.from('messages').insert([newMsg]);
            if (error) {
                console.error("Erreur Supabase (Save):", error.message);
                alert("Erreur de sauvegarde : " + error.message);
            }
        }

        function renderMessage(m) {
            const container = document.getElementById('messages-container');
            const isMe = m.username === userState.name;
            
            const div = document.createElement('div');
            div.className = `msg-block ${isMe ? 'me' : ''}`;
            
            let content = m.content;
            if (content.startsWith('http')) {
                content = `<img src="${content}" style="max-width:100%; border-radius:15px; border:1px solid var(--neon-blue); margin-top:10px;">`;
            } else if (content.startsWith('[FICHIER]')) {
                content = `<div style="padding:10px; background:rgba(255,255,255,0.05); border-radius:10px; border:1px dashed var(--neon-blue);">📁 ${content.replace('[FICHIER] ', '')}</div>`;
            }

            div.innerHTML = `
                <img src="${m.avatar_url || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="avatar-img">
                <div class="bubble-content">
                    <span class="user-tag">${m.username}</span>
                    ${content}
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function handleFile() {
            const f = document.getElementById('file-hidden').files[0];
            if (f) {
                document.getElementById('msg-input').value = `[FICHIER] ${f.name}`;
                transmit();
            }
        }

        // 5. EVENEMENTS
        document.getElementById('btn-transmit').onclick = transmit;
        document.getElementById('msg-input').onkeydown = (e) => { if (e.key === 'Enter') transmit(); };

    </script>
</body>
</html>
