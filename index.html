<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD 2026 | Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        /* THÈMES DE COULEURS */
        body.theme-blue { --neon-blue: #00f2ff; --accent: #001a33; }
        body.theme-green { --neon-blue: #00ff88; --accent: #001a0a; }
        body.theme-red { --neon-blue: #ff0055; --accent: #1a0005; }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, var(--accent) 0%, #000 100%);
            color: white; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; transition: 0.5s;
        }

        header {
            width: 100%; height: 50px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--neon-blue);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; box-shadow: 0 0 15px var(--neon-blue);
        }

        .logo { font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .app-container {
            margin-top: 40px; width: 850px; height: 550px;
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        aside { width: 220px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--glass-border); padding: 20px; }

        #chat-scroller { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        .message {
            max-width: 80%; padding: 12px; border-radius: 15px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
        }
        .message.me { align-self: flex-end; border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.05); }

        .chat-image { max-width: 100%; border-radius: 10px; border: 1px solid var(--neon-blue); }

        .input-bar { padding: 20px; background: rgba(0,0,0,0.3); display: flex; gap: 10px; }

        input, select {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 10px; color: white; outline: none;
        }

        .btn-send {
            background: var(--neon-blue); border: none; border-radius: 10px;
            padding: 0 20px; font-weight: bold; cursor: pointer; color: #000;
        }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #111; border: 1px solid var(--neon-blue);
            padding: 30px; border-radius: 20px; text-align: center;
        }
    </style>
</head>
<body class="theme-blue">

    <header>
        <div class="logo">LANOU-CORD 2026</div>
        <button class="btn-send" onclick="openSettings()">PROPRIÉTÉS</button>
    </header>

    <div class="app-container">
        <div class="main-layout">
            <aside>
                <h3 style="font-size: 10px; color: var(--neon-blue);">SYSTÈME</h3>
                <p style="font-size: 12px;">Utilisateur: <span id="display-name">...</span></p>
            </aside>
            <main style="flex:1; display:flex; flex-direction:column;">
                <div id="chat-scroller"></div>
                <div class="input-bar">
                    <input type="text" id="user-input" placeholder="Message ou /commande...">
                    <button class="btn-send" id="send-btn">ENVOYER</button>
                </div>
            </main>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3>PARAMÈTRES INTERFACE</h3>
            <input type="text" id="new-name" placeholder="Pseudo" style="width: 80%;"><br><br>
            <label>THÈME :</label>
            <select id="theme-select" style="width: 80%;">
                <option value="theme-blue">Néon Blue (Original)</option>
                <option value="theme-green">Emerald City</option>
                <option value="theme-red">Crimson Code</option>
            </select><br><br>
            <button class="btn-send" onclick="saveSettings()">APPLIQUER</button>
            <button class="btn-send" style="background:#444;" onclick="closeSettings()">FERMER</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        // SONS (Bip futuriste court)
        const notifySound = new Audio('https://raw.githubusercontent.com/rafaelreis-hotmart/Audio-Notification/master/notification.mp3');

        let user = {
            name: localStorage.getItem('u_2026') || "Cyber_User",
            theme: localStorage.getItem('t_2026') || "theme-blue"
        };

        document.body.className = user.theme;
        document.getElementById('display-name').innerText = user.name;

        function openSettings() { document.getElementById('modal').style.display='flex'; }
        function closeSettings() { document.getElementById('modal').style.display='none'; }
        
        function saveSettings() {
            user.name = document.getElementById('new-name').value || user.name;
            user.theme = document.getElementById('theme-select').value;
            localStorage.setItem('u_2026', user.name);
            localStorage.setItem('t_2026', user.theme);
            document.body.className = user.theme;
            document.getElementById('display-name').innerText = user.name;
            closeSettings();
        }

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const val = input.value.trim();
            if(!val) return;
            input.value = "";

            if(val.toLowerCase() === "/clear") {
                if(confirm("🚨 Purger les données ?")) await client.from('messages').delete().neq('id', 0);
                return;
            }

            await client.from('messages').insert([{ username: user.name, content: val, user_color: "var(--neon-blue)" }]);

            if(val.toLowerCase().includes("@gemini") || val.startsWith("/")) {
                let rep = "Analyse en cours... Protocol LANOU-CORD OK.";
                if(val.includes("story") || val.includes("récit")) rep = "Ok, voilà ton récit : 'Lanou découvrit un serveur caché dans les décombres de 2010...'";
                if(val.includes("image")) rep = "https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600";
                
                setTimeout(async () => {
                    await client.from('messages').insert([{ username: "Gemini AI", content: rep, user_color: "#00f2ff" }]);
                }, 800);
            }
        }

        document.getElementById('send-btn').onclick = sendMsg;
        document.getElementById('user-input').onkeydown = (e) => { if(e.key==='Enter') sendMsg(); };

        function render(m) {
            const chat = document.getElementById('chat-scroller');
            const div = document.createElement('div');
            const isMe = m.username === user.name;
            div.className = `message ${isMe ? 'me' : ''}`;
            
            let content = m.content;
            if(content.startsWith('http')) content = `<img src="${m.content}" class="chat-image">`;

            div.innerHTML = `<b style="color:${m.user_color}">${m.username}</b><br>${content}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

            // Jouer le son si ce n'est pas mon message
            if(!isMe) notifySound.play().catch(e => console.log("Son bloqué par le navigateur"));
        }

        async function load() {
            const { data } = await client.from('messages').select('*').order('created_at', {ascending: true}).limit(50);
            if(data) data.forEach(render);
            client.channel('any').on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => render(p.new)).subscribe();
        }
        load();
    </script>
</body>
</html>
