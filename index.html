<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD FIX</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #00a2ff; --bg: #121212; --panel: #1e1e1e; --text: #fff; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 70px; background: #000; border-bottom: 3px solid var(--primary); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo { font-family: 'Bungee'; color: var(--primary); font-size: 24px; }
        
        .btn { padding: 10px 15px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; background: #333; }
        .btn-send { background: #02b757; }
        
        .main { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 10px; }
        aside { width: 200px; background: var(--panel); border-radius: 10px; padding: 15px; }
        section { flex: 1; background: var(--panel); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        
        #chat-output { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border-left: 3px solid var(--primary); }
        
        .input-zone { padding: 15px; background: #252525; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: white; }

        #modal-settings { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #222; padding: 30px; border-radius: 15px; border: 2px solid var(--primary); width: 300px; text-align: center; }
    </style>
</head>
<body>

    <div id="modal-settings">
        <div class="modal-box">
            <h3>RÉGLAGES</h3>
            <input type="color" id="user-color-pick" style="width:100%; height:40px; margin: 10px 0;">
            <button class="btn" style="width:100%" onclick="closeSettings()">OK</button>
        </div>
    </div>

    <header>
        <div class="logo">LANOU-CORD</div>
        <div>
            <button class="btn" onclick="openSettings()">⚙️</button>
            <a href="https://discord.gg/6Zq7GKypYy" target="_blank" style="text-decoration:none" class="btn">DISCORD</a>
        </div>
    </header>

    <div class="main">
        <aside>
            <b id="display-name">...</b>
            <div id="display-lvl" style="font-size: 12px; color: var(--primary);">Niveau 1</div>
        </aside>
        <section>
            <div id="chat-output"></div>
            <div class="input-zone">
                <input type="text" id="chat-input" placeholder="Message...">
                <button class="btn btn-send" onclick="handleSend()">ENVOYER</button>
            </div>
        </section>
    </div>

    <script>
        // ON UTILISE DES NOMS DE VARIABLES UNIQUES POUR EVITER LES ERREURS
        const PROJECT_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const PROJECT_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        
        // Initialisation unique
        const clientSupabase = window.supabase.createClient(PROJECT_URL, PROJECT_KEY);

        let currentUser = {
            name: localStorage.getItem('lanou_user') || prompt("Pseudo ?") || "Anonyme",
            color: localStorage.getItem('lanou_color') || "#00a2ff"
        };
        localStorage.setItem('lanou_user', currentUser.name);

        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-name').style.color = currentUser.color;

        // --- FONCTIONS ---
        function openSettings() { document.getElementById('modal-settings').style.display = 'flex'; }
        
        function closeSettings() {
            currentUser.color = document.getElementById('user-color-pick').value;
            localStorage.setItem('lanou_color', currentUser.color);
            document.getElementById('display-name').style.color = currentUser.color;
            document.getElementById('modal-settings').style.display = 'none';
        }

        async function handleSend() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if(!val) return;
            input.value = "";

            const { error } = await clientSupabase.from('messages').insert([
                { username: currentUser.name, content: val, user_color: currentUser.color }
            ]);
            if(error) console.error("Erreur d'envoi", error);
        }

        function renderMessage(m) {
            const out = document.getElementById('chat-output');
            const div = document.createElement('div');
            div.className = "msg";
            div.innerHTML = `<b style="color:${m.user_color}">${m.username}</b>: ${m.content}`;
            out.appendChild(div);
            out.scrollTop = out.scrollHeight;
        }

        // --- LANCEMENT ---
        async function boot() {
            // Charger les messages existants
            const { data } = await clientSupabase.from('messages').select('*').order('created_at', {ascending: true}).limit(50);
            if(data) data.forEach(msg => renderMessage(msg));

            // Ecouter le temps réel
            clientSupabase.channel('any').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                renderMessage(payload.new);
            }).subscribe();
        }

        document.getElementById('chat-input').onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
        
        boot();
    </script>
</body>
</html>
