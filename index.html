<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LANOU-CORD | CORE SYSTEM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ---------------------------------------------------------
           SECTION 1 : DESIGN & UI (LIGNES 30 - 200)
        --------------------------------------------------------- */
        :root {
            --neon: #00f2ff;
            --bg: #00050a;
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.15);
        }

        body.theme-blue { --neon: #00f2ff; --grad: radial-gradient(circle, #001a33 0%, #00050a 100%); }
        body.theme-green { --neon: #00ff88; --grad: radial-gradient(circle, #001a0a 0%, #00050a 100%); }
        body.theme-red { --neon: #ff0055; --grad: radial-gradient(circle, #1a0005 0%, #00050a 100%); }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--grad);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            height: 60px;
            background: rgba(0,0,0,0.8);
            border-bottom: 2px solid var(--neon);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
        }

        /* LAYOUT PRINCIPAL */
        .container {
            flex: 1;
            display: flex;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            padding: 20px;
            display: none; /* Caché au début */
        }

        @media (min-width: 900px) { .sidebar { display: flex; flex-direction: column; } }

        .nav-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item:hover { background: var(--glass); border: 1px solid var(--neon); }

        /* CHAT VIEWPORT */
        .chat-box {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* MESSAGES BUBBLES */
        .m-row { display: flex; gap: 10px; max-width: 85%; animation: pop 0.3s ease; }
        .m-row.me { align-self: flex-end; flex-direction: row-reverse; }

        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon); }
        
        .bubble {
            padding: 12px 16px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            position: relative;
        }

        .me .bubble { background: rgba(0, 242, 255, 0.1); border-color: var(--neon); }

        .u-name { font-size: 10px; font-weight: bold; color: var(--neon); margin-bottom: 4px; display: block; }

        /* INPUT AREA */
        .input-area {
            padding: 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: white;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-neon { background: var(--neon); color: black; }
        .btn-neon:hover { transform: translateY(-2px); box-shadow: 0 0 15px var(--neon); }

        /* MODALS SÉCURISÉS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-card {
            background: #000810;
            border: 2px solid var(--neon);
            padding: 40px;
            border-radius: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.2);
        }

        .pfp-big {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--neon);
            margin-bottom: 20px;
            cursor: pointer;
            object-fit: cover;
        }
    </style>
</head>

<body class="theme-blue">

    <header>
        <div class="logo">LANOU-CORD</div>
        <button class="btn btn-neon" style="font-size: 10px;" onclick="location.reload()">RELOAD SYSTEM</button>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h4 style="color:var(--neon); font-size:12px; margin-bottom:15px;">NETWORKS</h4>
            <div class="nav-item"># GENERAL-HUB</div>
            <div class="nav-item"># MEDIA-ZONE</div>
            <div class="nav-item" style="opacity:0.3"># ARCHIVES</div>
        </aside>

        <main class="chat-box">
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msg-in" class="input-field" placeholder="Type a message...">
                <button class="btn btn-neon" onclick="handleSend()">SEND</button>
            </div>
        </main>
    </div>

    <div id="auth-screen" class="modal-overlay">
        <div class="modal-card">
            <h1 style="color:var(--neon); margin-bottom:20px;">IDENTIFICATION</h1>
            
            <img id="pfp-view" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="pfp-big" onclick="document.getElementById('pfp-file').click()">
            <input type="file" id="pfp-file" style="display:none" onchange="updatePFP(this)">
            
            <input type="text" id="pseudo" class="input-field" style="width:100%; margin-bottom:20px; text-align:center;" placeholder="Pseudo...">
            
            <button type="button" class="btn btn-neon" style="width:100%; height:50px;" onclick="forceLogin()">ACCÉDER AU RÉSEAU</button>
            
            <p id="error-log" style="color:red; font-size:10px; margin-top:10px;"></p>
        </div>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const S_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI";
        
        let db;
        try {
            db = window.supabase.createClient(S_URL, S_KEY);
        } catch(e) {
            console.error("Supabase fail, mode local activé.");
        }

        let user = {
            name: localStorage.getItem('ln_name') || null,
            pfp: localStorage.getItem('ln_pfp') || "https://cdn-icons-png.flaticon.com/512/149/149071.png"
        };

        // GESTION DU BOUTON (VÉRIFICATION MAXIMALE)
        function forceLogin() {
            const input = document.getElementById('pseudo');
            const name = input.value.trim();
            const errorLog = document.getElementById('error-log');

            console.log("Clic détecté sur le bouton Accéder");

            if (!name) {
                errorLog.innerText = "ERREUR : ENTREZ UN PSEUDO !";
                return;
            }

            // Sauvegarde
            user.name = name;
            localStorage.setItem('ln_name', name);
            localStorage.setItem('ln_pfp', user.pfp);

            // Cacher le modal immédiatement
            document.getElementById('auth-screen').style.display = 'none';
            console.log("Connexion réussie pour : " + name);

            // Lancer le chargement des données
            initApp();
        }

        function updatePFP(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('pfp-view').src = e.target.result;
                    user.pfp = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function initApp() {
            // Charger les messages existants (POUR LE REFRESH)
            if (db) {
                const { data, error } = await db
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(50);

                if (data) {
                    document.getElementById('messages').innerHTML = "";
                    data.forEach(m => addMessage(m));
                }

                // Ecoute temps réel
                db.channel('global').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
                    if (p.new.username !== user.name) addMessage(p.new);
                }).subscribe();
            }
        }

        async function handleSend() {
            const input = document.getElementById('msg-in');
            const val = input.value.trim();
            if (!val) return;

            const pack = {
                username: user.name,
                content: val,
                avatar_url: user.pfp
            };

            // Rendu local (Instantané)
            addMessage(pack);
            input.value = "";

            // Envoi Cloud
            if (db) {
                const { error } = await db.from('messages').insert([pack]);
                if (error) console.error("Erreur d'envoi cloud");
            }
        }

        function addMessage(m) {
            const box = document.getElementById('messages');
            const isMe = m.username === user.name;
            
            const div = document.createElement('div');
            div.className = `m-row ${isMe ? 'me' : ''}`;
            
            div.innerHTML = `
                <img src="${m.avatar_url}" class="avatar">
                <div class="bubble">
                    <span class="u-name">${m.username}</span>
                    <div class="txt">${m.content}</div>
                </div>
            `;
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // AU CHARGEMENT : Si déjà connecté, on saute le modal
        window.onload = () => {
            if (user.name) {
                document.getElementById('auth-screen').style.display = 'none';
                initApp();
            }
        };

        // Touche Entrée
        document.getElementById('msg-in').onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
