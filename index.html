        .discord-btn {

            background: linear-gradient(to bottom, #3dbd3d 0%, #1d8f1d 100%);
            border: 2px solid #ffffff; border-radius: 5px;
            color: white; font-weight: bold; font-size: 14px;

            box-shadow: 0 4px 0 #125a12, 0 6px 10px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        .discord-btn:hover { background: linear-gradient(to bottom, #45d445 0%, #22a622 100%); }
        .discord-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #125a12; }
        .discord-btn span { font-size: 18px; display: block; }

        /* Conteneur principal */
        .container { 
            display: flex; flex: 1; width: 95%; max-width: 1100px;
            background: white; margin: 20px 0; border-radius: 10px;
            overflow: hidden; border: 2px solid #555;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .sidebar { width: 220px; background: #f0f0f0; padding: 20px; border-right: 2px solid #ccc; }
        .channel-btn {
            background: #fff; border: 1px solid #999; border-bottom: 3px solid #777;
            padding: 10px; margin-bottom: 8px; cursor: pointer;
            font-weight: bold; border-radius: 5px; width: 100%; text-align: center;
        }
        .channel-btn.active { background: #00a2ff; color: white; border-color: #0055ff; }

        .chat-section { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #messages { flex: 1; background: #fff; border: 1px solid #ccc; padding: 15px; overflow-y: auto; border-radius: 5px; }
        .msg-bubble { margin-bottom: 8px; padding: 8px; border-bottom: 1px dotted #ccc; font-size: 14px; }

        .input-box { margin-top: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 5px; }
        .send-btn {
            background: #02b757; color: white; border: none;
