    <style>
        /* DESIGN STYLE 2010 (Glossy & Gradients) */
        :root {
            --win-blue: #0053e1;
            --win-header: linear-gradient(to bottom, #74b0f0 0%, #1959d1 100%);
            --win-bg: #ece9d8; /* Couleur Windows XP/7 */
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0; padding: 0; font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: #3a6ea5; /* Fond bleu classique */
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- TASKBAR 2010 --- */
        header {
            background: var(--win-header); height: 50px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; border-bottom: 2px solid #003da0; color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .logo-2010 { font-weight: 900; font-size: 20px; text-shadow: 1px 1px 3px #000; }

        /* --- MAIN LAYOUT --- */
        .window-container {
            display: flex; flex: 1; padding: 15px; gap: 15px; overflow: hidden;
        }

        .win-panel {
            background: white; border: 2px solid #0053e1; border-radius: 8px 8px 0 0;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column;
        }

        /* --- LISTE D'AMIS (NOUVEAU) --- */
        aside { width: 260px; }
        .win-header { 
            background: var(--win-header); color: white; padding: 8px 12px; 
            font-weight: bold; font-size: 13px; display: flex; justify-content: space-between;
        }

        .friend-list { flex: 1; overflow-y: auto; background: white; padding: 10px; }
        .friend-item {
            display: flex; align-items: center; gap: 10px; padding: 8px;
            border-bottom: 1px solid #eee; cursor: pointer; border-radius: 4px;
        }
        .friend-item:hover { background: #e0ecff; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .online { background: #31ff31; box-shadow: 0 0 5px #31ff31; }

        /* --- CHAT AREA --- */
        main { flex: 1; }
        #chat-scroller {
            flex: 1; padding: 15px; overflow-y: auto; background: #fff url('https://www.transparenttextures.com/patterns/cubes.png');
            display: flex; flex-direction: column; gap: 10px;
        }

        .bubble {
            max-width: 80%; padding: 10px; border-radius: 12px; position: relative;
            background: #f1f1f1; border: 1px solid #ccc; font-size: 14px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }
        .bubble.me { align-self: flex-end; background: #e1ffc7; border-color: #b7e88f; }
        .bubble b { color: #0053e1; }

        .input-box {
            background: #f0f0f0; padding: 15px; display: flex; gap: 10px;
            border-top: 1px solid #ccc;
        }

        input[type="text"] {
            flex: 1; padding: 10px; border: 2px solid #0053e1; border-radius: 4px;
        }

        .btn-win {
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #707070; padding: 5px 15px; border-radius: 3px;
            font-weight: bold; cursor: pointer; color: #333;
        }
        .btn-win:hover { background: #e5f1fb; border-color: #0078d7; }

        /* --- MODAL PARAMETRES --- */
        #modal-win {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-body {
            width: 350px; background: var(--win-bg); border: 3px solid #0053e1;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5);
        }

        /* --- BOT ASSISTANT --- */
        .assistant-notif {
            background: #fff9c4; border: 1px solid #fbc02d; padding: 10px;
            margin: 10px; font-size: 12px; border-radius: 5px; display: none;
        }
    </style>
</head>
