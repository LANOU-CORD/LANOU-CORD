<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANOU-CORD | NEXUS EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00ffcc; --bg: #0b0b0d; --panel: #111214; --sidebar: #000000; --hover: #35373d; --text-muted: #b9bbbe; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.2s; }
        body { margin: 0; background: var(--bg); color: white; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* NAV SERVEURS */
        .srv-nav { width: 72px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 10px; border-right: 1px solid #111; }
        .srv-icon { width: 48px; height: 48px; background: #2b2d31; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; border: none; font-size: 18px; }
        .srv-icon:hover, .srv-icon.active { border-radius: 15px; background: var(--main); color: black; box-shadow: 0 0 15px var(--main); }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: 800; color: var(--main); border-bottom: 1px solid #1e1f22; font-size: 14px; text-transform: uppercase; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
        .cat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 18px 0 6px 4px; display: flex; justify-content: space-between; }
        .item { padding: 8px 10px; border-radius: 5px; cursor: pointer; color: #8e9297; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
        .item:hover, .item.active { background: var(--hover); color: white; }

        /* UTILISATEUR */
        .user-panel { padding: 8px; background: #232428; display: flex; align-items: center; gap: 8px; border-top: 1px solid #1e1f22; }
        .u-ava { width: 32px; height: 32px; border-radius: 50%; background: var(--main); position: relative; cursor: pointer; }
        .u-info { flex: 1; cursor: pointer; }
        .u-name { font-size: 13px; font-weight: 700; }

        /* CHAT */
        .main { flex: 1; display: flex; flex-direction: column; background: #313338; }
        .top-nav { height: 48px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid #26272b; font-weight: 600; gap: 10px; }
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { display: flex; gap: 15px; animation: fadeIn 0.3s; }
        .m-ava { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
        .m-user { font-weight: 600; }
        .m-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; }
        .m-text { color: #dcddde; margin-top: 2px; }

        .input-area { padding: 0 20px 24px 20px; }
        .input-box { background: #383a40; border-radius: 8px; padding: 11px 16px; }
        #main-input { background: transparent; border: none; color: white; width: 100%; outline: none; }

        /* MODAL */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: #18191c; width: 400px; border-radius: 8px; padding: 20px; border: 1px solid #333; }
        input[type="text"] { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .btn-save { background: var(--main); color: black; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="srv-nav">
        <button class="srv-icon active" onclick="location.reload()">LC</button>
        <button class="srv-icon" style="color:#43b581;" onclick="createRoom()">+</button>
    </nav>

    <aside class="sidebar">
        <div class="sidebar-header">Lanou-Cord Studio</div>
        <div class="scroll-area">
            <div class="item" id="btn-friends" onclick="showFriends()">👥 Amis</div>
            <div class="cat-label">Salons Textuels <span onclick="createRoom()" style="cursor:pointer">+</span></div>
            <div id="channels-list"></div>
        </div>
        <div class="user-panel">
            <div class="u-ava" id="my-ava" onclick="openSettings()"></div>
            <div class="u-info" onclick="openSettings()">
                <div class="u-name" id="my-name">Chargement...</div>
                <div style="font-size:10px; color:var(--text-muted)">#<span id="my-id"></span></div>
            </div>
            <button onclick="openSettings()" style="background:none; border:none; cursor:pointer;">⚙️</button>
        </div>
    </aside>

    <main class="main">
        <div class="top-nav">
            <span style="color:#72767d; font-size:20px;">#</span>
            <span id="nav-title">général</span>
        </div>
        <div id="messages-container"></div>
        <div class="input-area" id="input-zone">
            <div class="input-box">
                <input type="text" id="main-input" placeholder="Envoyer un message...">
            </div>
        </div>
    </main>

    <div id="modal-settings" class="overlay" onclick="if(event.target==this) closeSettings()">
        <div class="modal">
            <h3>Paramètres Profil</h3>
            <input type="text" id="set-name" placeholder="Pseudo">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <label>Couleur : <input type="color" id="set-color-ava"></label>
            </div>
            <button class="btn-save" onclick="saveSettings()">ENREGISTRER</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://pxyrfrgwvmyflrunpvhl.supabase.co"; 
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4eXJmcmd3dm15ZmxydW5wdmhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjg0NDcsImV4cCI6MjA5MTg0NDQ0N30.K6cs-mSRFmQg9gPzjU-GSarMDgAv2AbvBKJj4Nb8plI"; 
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let user = {
            id: localStorage.getItem('ln_id') || Math.floor(1000 + Math.random()*9000),
            name: localStorage.getItem('ln_name') || "User-" + Math.floor(Math.random()*999),
            color: localStorage.getItem('ln_color') || "#00ffcc"
        };
        localStorage.setItem('ln_id', user.id);
        let activeChannel = "général";

        async function init() {
            updateUI(); 
            await loadChannels(); 
            await loadMessages();
            
            // Écoute des messages en temps réel
            supabase.channel('room1').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'}, p => {
                if(p.new.channel === activeChannel) renderMessage(p.new);
            }).subscribe();

            // Écoute des nouveaux salons
            supabase.channel('room2').on('postgres_changes',{event:'INSERT',schema:'public',table:'channels'}, () => loadChannels()).subscribe();
        }

        function updateUI() {
            document.getElementById('my-name').innerText = user.name;
            document.getElementById('my-id').innerText = user.id;
            document.getElementById('my-ava').style.background = user.color;
            document.getElementById('set-name').value = user.name;
            document.getElementById('set-color-ava').value = user.color;
        }

        async function loadChannels() {
            const { data } = await supabase.from('channels').select('*').order('name');
            const list = document.getElementById('channels-list');
            list.innerHTML = "";
            data?.forEach(c => {
                const div = document.createElement('div');
                div.className = `item ${activeChannel === c.name ? 'active' : ''}`;
                div.innerHTML = `# ${c.name}`;
                div.onclick = () => switchChannel(c.name);
                list.appendChild(div);
            });
        }

        function switchChannel(name) {
            activeChannel = name;
            document.getElementById('nav-title').innerText = name;
            document.getElementById('input-zone').style.display = "block";
            document.getElementById('btn-friends').classList.remove('active');
            loadChannels();
            loadMessages();
        }

        async function showFriends() {
            activeChannel = null;
            document.getElementById('nav-title').innerText = "Amis";
            document.getElementById('input-zone').style.display = "none";
            document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
            document.getElementById('btn-friends').classList.add('active');
            
            const { data } = await supabase.from('messages').select('username, color');
            const uniqueUsers = [...new Map(data.map(item => [item['username'], item])).values()];
            
            const container = document.getElementById('messages-container');
            container.innerHTML = "<h3>Utilisateurs en ligne</h3>";
            uniqueUsers.forEach(u => {
                container.innerHTML += `<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <div style="width:30px; height:30px; border-radius:50%; background:${u.color}"></div>
                    <span>${u.username}</span>
                </div>`;
            });
        }

        async function createRoom() {
            const n = prompt("Nom du salon :");
            if(n) await supabase.from('channels').insert([{ name: n.toLowerCase().trim() }]);
        }

        async function loadMessages() {
            if(!activeChannel) return;
            const container = document.getElementById('messages-container');
            container.innerHTML = "";
            const { data } = await supabase.from('messages').select('*').eq('channel', activeChannel).order('created_at', {ascending: true});
            data?.forEach(m => renderMessage(m));
        }

        function renderMessage(m) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = "message";
            const time = new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            div.innerHTML = `
                <div class="m-ava" style="background:${m.color}"></div>
                <div>
                    <span class="m-user" style="color:${m.color}">${m.username}</span><span class="m-time">${time}</span>
                    <div class="m-text">${m.content}</div>
                </div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const inp = document.getElementById('main-input');
            if(!inp.value.trim()) return;
            const msg = inp.value; inp.value = "";
            await supabase.from('messages').insert([{ username: user.name, content: msg, color: user.color, channel: activeChannel }]);
        }

        function openSettings() { document.getElementById('modal-settings').style.display = "flex"; }
        function closeSettings() { document.getElementById('modal-settings').style.display = "none"; }
        function saveSettings() {
            user.name = document.getElementById('set-name').value;
            user.color = document.getElementById('set-color-ava').value;
            localStorage.setItem('ln_name', user.name);
            localStorage.setItem('ln_color', user.color);
            updateUI(); closeSettings();
        }

        document.getElementById('main-input').onkeydown = (e) => { if(e.key === 'Enter') sendMessage(); };
        init();
    </script>
</body>
</html>
